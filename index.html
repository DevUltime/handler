<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <title>Nexora | Connexion</title>
</head>

<body>
    <section class="auth">

        <div class="header_auth">
            <img src="icons/logo_nexora.svg" alt="logo">
            <h2>Nexora</h2>
            <p>Empowering Educators, Inspiring Minds</p>
        </div>

        <div class="auth_buttons">
            <button>sign Up</button>
            <button>Sign In</button>
        </div>

        <div class="auth_forms">

            <div class="form_inscription">
                <form action="">
                    <h3>Welcome to <span>Nexora</span>!</h3>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name">
                    <label for="first-name">First Name</label>
                    <input type="text" name="first_name" id="first-name">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password">
                    <label for="confirmation">Confirmation</label>
                    <input type="password" name="confirmation" id="confirmation">
                    <button type="submit">Sign UP <img src="icons/arrow_back.svg" alt="icon"></button>

                </form>
            </div>

            <div class="form_login">
                <form action="">
                    <h3>WELCOME BACK!</h3>
                    <p>Please enter your credentials to access your dashboard.</p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="teacher@scholl.edu">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="........">

                    <div>
                        <label>
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#">Forgot Password</a>
                    </div>

                    <button type="submit">Sign In <img src="icons/arrow_back.svg" alt="icon"></button>

                </form>

            </div>


        </div>

    </section>
</body>

</html>
